services:
  - type: web
    name: skillproof
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "PYTHONPATH=backend python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.2
      - key: DATABASE_URL
        value: sqlite:///skillproof.db
